# Manual only. Publishes one guide (English + its market versions) through the API writer.
# It wakes every hour; data/schedule.json holds the next due time, set a random
# 24–36 hours after each post, so posts never land on a fixed rhythm.
# Secrets: ANTHROPIC_API_KEY and GOOGLE_CLOUD_API_KEY (required); SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASS
# for the failure email (ALERT_EMAIL and MAIL_FROM optional). Variable: SITE_URL.
name: Publish post

on:
  # The hourly schedule (cron "17 * * * *") was turned off for the build-out:
  # the CLI engine and the weekly workflow replace it. Manual runs still work.
  workflow_dispatch:
    inputs:
      force:
        description: "Publish now, ignoring the schedule (still exactly one post)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publish-post
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A queued run may start from an older commit; always work on the latest main.
      - name: Update to latest main
        run: git pull --ff-only origin "${GITHUB_REF_NAME}"

      - name: Is a post due?
        id: due
        run: node scripts/is-due.mjs ${{ inputs.force && '--force' || '' }}

      - uses: actions/setup-node@v4
        if: steps.due.outputs.due == 'true'
        with:
          node-version: 24
          cache: npm

      - name: Install
        if: steps.due.outputs.due == 'true'
        run: npm ci

      - name: Research, write, check and build one post
        id: post
        if: steps.due.outputs.due == 'true'
        run: npm run post -- ${{ inputs.force && '--force' || '' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          TRANSLATION_MODEL: ${{ vars.TRANSLATION_MODEL }}
          MAX_POST_USD: ${{ vars.MAX_POST_USD }}
          GOOGLE_CLOUD_API_KEY: ${{ secrets.GOOGLE_CLOUD_API_KEY }}
          GOOGLE_CLOUD_PROJECT: ${{ vars.GOOGLE_CLOUD_PROJECT }}
          SITE_URL: ${{ vars.SITE_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}

      # Commit the post, the spreadsheet status and the schedule; after a failure
      # only data/schedule.json changes (the retry time), so it is committed too.
      - name: Commit and push
        if: always() && steps.due.outputs.due == 'true'
        env:
          PUBLISHED: ${{ steps.post.outputs.published }}
          TITLE: ${{ steps.post.outputs.title }}
        run: |
          git config user.name "safety-index-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/posts docs/Safety_Blog_Topics.xlsx data/schedule.json
          if git diff --cached --quiet; then echo "Nothing to commit"; exit 0; fi
          if [ "$PUBLISHED" = "true" ]; then
            git commit -m "Publish: $TITLE"
          else
            git commit -m "Schedule: retry after a failed post"
          fi
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
